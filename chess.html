<!DOCTYPE html>
<html>
<head>
    <title>Chessboard</title>

    <style>
        body {
            text-align: center;
        }

        #board {
            width: 400px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(8, 50px);
        }

        .box {
            width: 50px;
            height: 50px;
        }

        .white {
            background-color: white;
        }

        .black {
            background-color: black;
        }
    </style>
</head>

<body>

    <h2>Chessboard</h2>

    <div id="board"></div>

    <script>
        let board = document.getElementById("board");

        for (let i = 1; i <= 8; i++) {

            for (let j = 1; j <= 8; j++) {

                let box = document.createElement("div");

                box.className = "box";

                if ((i + j) % 2 == 0) {
                    box.className = "box white";
                }
                else {
                    box.className = "box black";
                }

                board.appendChild(box);
            }
        }
    </script>

</body>
</html>
