<body>
    <script>
        let age = prompt("Please enter the age");
     age=Number(age);
       if(age >=0 && Number.isFinite(age) && Number.isInteger(age)){
          if(age>=18){
        document.write(age+" eligible to vote");
        } else{
            document.write(age+" not elegible to vote.");
        } 
    }
    </script>
